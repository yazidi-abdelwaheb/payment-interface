services:
  backend:
    container_name: payment-backend-dev
    build: .
    command: npm run server:dev
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
      - sqlite-data:/app/src/server/db
    environment:
      - NODE_ENV=development

  frontend:
    container_name: payment-frontend-dev
    build: .
    command: npm run client:dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  sqlite-data:
